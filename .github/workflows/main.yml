name: Ephemeral Windows Desktop (Unbounded)

on:
  workflow_dispatch:

jobs:
  provision-windows-node:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo chmod 666 /dev/kvm

      - name: Establish Tailnet Connection
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}


      - name: Extract Tailscale IP
        id: ts-ip
        run: echo "TS_IP=$(tailscale ip -4)" >> $GITHUB_ENV

      - name: Deploy Windows Container (Host Network & Privileged)
        run: |
          docker run -d \
            --name windows-gui \
            --privileged \
            --net=host \
            --device /dev/kvm \
            -e RAM_SIZE="MAX" \
            -e CPU_CORES="MAX" \
            dockurr/windows

      - name: Output Connection Interfaces
        run: |
          echo "=========================================="
          echo "Web UI (NoVNC): http://${{ env.TS_IP }}:8006"
          echo "RDP Client:     ${{ env.TS_IP }}:3389"
          echo "=========================================="
