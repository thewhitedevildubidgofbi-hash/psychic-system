name: Runner Hardware Telemetry

on:
  workflow_dispatch: # Permits manual execution via GitHub Actions UI
  push:
    branches:
      - main

jobs:
  analyze-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Kernel & OS Telemetry
        run: |
          uname -a
          cat /etc/os-release

      - name: CPU Telemetry
        run: lscpu

      - name: RAM Allocation
        run: |
          free -h
          cat /proc/meminfo | head -n 5

      - name: Storage Telemetry
        run: |
          lsblk
          df -h

      - name: Network Interface Telemetry
        run: ip a

      - name: Complete Hardware Inventory
        run: sudo lshw -short
