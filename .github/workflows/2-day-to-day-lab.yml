name: 2. Launch Kali Remote Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options: [ '1', '2', '3', '4', '5' ] # Capped at 5 to allow 1 hour for safe teardown

jobs:
  run-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Hard boundary for GitHub Actions
    steps:
      - name: Maximize Runner Storage
        run: |
          echo "Purging unnecessary host environments to maximize Docker storage..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Latest Saved State
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/kali-study-lab:latest

      - name: Initialize VM-Parity Container
        run: |
          # FUSE added, AppArmor unconfined, and cgroup mapped for deep systemd integration
          docker run -d \
            --name my-kali-container \
            --privileged \
            --network host \
            --pid host \
            --ipc host \
            --cgroupns host \
            --shm-size=4g \
            --device /dev/fuse \
            --security-opt apparmor:unconfined \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }} \
            -e ROOT_PASSWORD=${{ secrets.KALI_ROOT_PASSWORD }} \
            ${{ secrets.DOCKER_USERNAME }}/kali-study-lab:latest

      - name: Telemetry Loop & Auto-Save Monitor
        run: |
          HOURS=${{ inputs.lab_duration_hours }}
          # Exact seconds calculation without subtracting 15m, because the 5-hour max gives us an hour buffer
          MAX_SECONDS=$(( HOURS * 3600 )) 
          START_TIME=$(date +%s)
          
          echo "Lab initiated. Connect via RDP as 'root'."
          echo "Maximum duration set to: ${HOURS} hours."
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Timeout reached. Initiating auto-save."
              break
            fi
            
            if docker exec my-kali-container test -f /root/Desktop/close.txt; then
              echo "Signal file 'close.txt' detected. Initiating teardown."
              break
            fi
            
            sleep 30
          done

      - name: Squash Layers & Push Persistence
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^my-kali-container$'; then
            echo "Cleaning signal file..."
            docker exec my-kali-container rm -f /root/Desktop/close.txt || true
            
            echo "Initiating graceful systemd shutdown..."
            # systemd requires time to flush disk I/O cleanly
            docker stop -t 45 my-kali-container || true
            
            IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/kali-study-lab"
            RUN_TAG="${IMAGE_TAG}:run-${{ github.run_id }}"
            LATEST_TAG="${IMAGE_TAG}:latest"
            
            echo "Exporting flat filesystem (Squashing layers)..."
            docker export my-kali-container > state.tar
            
            echo "Rebuilding un-bloated image..."
            cat << 'EOF' > Dockerfile.squash
            FROM scratch
            ADD state.tar /
            ENV DEBIAN_FRONTEND=noninteractive
            EXPOSE 3389
            ENTRYPOINT ["/entrypoint.sh"]
            EOF
            
            docker build -f Dockerfile.squash -t $RUN_TAG .
            docker tag $RUN_TAG $LATEST_TAG
            
            echo "Uploading optimized state to registry..."
            docker push $RUN_TAG
            docker push $LATEST_TAG
            echo "Squash and push completed successfully."
          else
            echo "Container was not found. Skipping persistence."
          fi
