name: Deploy Kali Linux Analysis Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options: [ '1', '2', '3', '4', '5', '6' ]
      build_new_image:
        description: 'Force compilation of fresh Kali baseline?'
        required: true
        default: 'false'
        type: boolean

jobs:
  run-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Runner Storage
        run: |
          echo "Purging host SDKs to maximize storage allocation..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Authenticate to Docker Registry
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Resolve Environment State & Compile Baseline
        run: |
          IMAGE_NAME="surajgupta2009/kalidocker:latest"
          
          if [ "${{ github.event.inputs.build_new_image }}" == "true" ] || ! docker pull $IMAGE_NAME; then
            echo "State not found or override requested. Compiling hardened Kali Linux layer stack..."
            
          cat << 'EOF' > Dockerfile
          FROM kalilinux/kali-rolling
          
          ENV DEBIAN_FRONTEND=noninteractive
          
          # Injected tini (Container Init System) to resolve D-Bus kernel sandboxing
          RUN apt-get update && apt-get upgrade -y && \
              apt-get install -y curl wget gnupg dbus dbus-x11 xfce4 xfce4-goodies sudo nano net-tools iputils-ping xvfb xauth xfonts-base mesa-utils x11-xserver-utils tini && \
              (apt-get remove --purge -y light-locker xfce4-screensaver || true) && \
              apt-get autoremove -y && \
              apt-get clean
          
          RUN curl -fsSL https://tailscale.com/install.sh | sh || true
          
          RUN curl -fSL -o /tmp/nomachine.deb "https://download.nomachine.com/download/9.5/Linux/nomachine_9.5.7_2_amd64.deb" && \
              (dpkg -i /tmp/nomachine.deb || true) && \
              apt-get install -f -y && \
              test -d /usr/NX/etc || (echo "FATAL: NoMachine installation failed." && exit 1) && \
              rm /tmp/nomachine.deb
          
          # Map to virtual display and explicitly neutralize Audio-Sink deadlock vectors
          RUN echo 'PhysicalDisplays ":0"' >> /usr/NX/etc/node.cfg && \
              echo 'AudioInterface disabled' >> /usr/NX/etc/node.cfg && \
              sed -i 's/^EnableAudio 1/EnableAudio 0/g' /usr/NX/etc/server.cfg || echo 'EnableAudio 0' >> /usr/NX/etc/server.cfg
          
          RUN dbus-uuidgen > /etc/machine-id && dbus-uuidgen > /var/lib/dbus/machine-id
          
          RUN useradd -m -s /bin/bash kali && echo 'kali:kali' | chpasswd && usermod -aG sudo,video,render kali
          RUN mkdir -p /home/kali/Desktop && chown -R kali:kali /home/kali
          
          # Stripped xfconf-query to simplify XFCE boot sequence
          RUN echo '#!/bin/bash' > /root/start.sh && \
              echo 'mkdir -p /run/dbus' >> /root/start.sh && \
              echo 'dbus-daemon --system' >> /root/start.sh && \
              echo 'tailscaled --state=/var/lib/tailscale/tailscaled.state &' >> /root/start.sh && \
              echo 'sleep 5' >> /root/start.sh && \
              echo 'rm -rf /tmp/.X11-unix && mkdir -p /tmp/.X11-unix && chmod 1777 /tmp/.X11-unix' >> /root/start.sh && \
              echo 'rm -f /tmp/.X0-lock' >> /root/start.sh && \
              echo 'Xvfb :0 -ac -screen 0 1920x1080x24 -dpms -s 0 &' >> /root/start.sh && \
              echo 'sleep 2' >> /root/start.sh && \
              echo 'export DISPLAY=:0 && xhost +' >> /root/start.sh && \
              echo 'sudo -u kali bash -c "export DISPLAY=:0 && export LIBGL_ALWAYS_SOFTWARE=1 && export GALLIUM_DRIVER=llvmpipe && dbus-launch startxfce4 > /home/kali/desktop.log 2>&1" &' >> /root/start.sh && \
              echo 'sleep 4' >> /root/start.sh && \
              echo '/usr/NX/bin/nxserver --startup' >> /root/start.sh && \
              echo 'sleep 2' >> /root/start.sh && \
              echo '/usr/NX/bin/nxserver --restart' >> /root/start.sh && \
              echo 'sleep infinity' >> /root/start.sh && \
              chmod +x /root/start.sh
          
          # Initialize container with Tini as PID 1 to manage system calls, then pass start.sh to bash
          ENTRYPOINT ["/usr/bin/tini", "--"]
          CMD ["/bin/bash", "/root/start.sh"]
          EOF
          
            docker build -t $IMAGE_NAME .
            docker push $IMAGE_NAME
          else
            echo "Successfully retrieved persistent image state."
          fi

      - name: Initialize Lab Container
        run: |
          docker run -d \
            --name lab-node \
            --privileged \
            --network host \
            --pid host \
            --ipc host \
            --shm-size="2g" \
            --cgroupns host \
            surajgupta2009/kalidocker:latest

      - name: Tailscale Network Initialization
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTHKEY }}" ]; then
            echo "FATAL: TAILSCALE_AUTHKEY secret is missing. Cannot establish overlay network."
            exit 1
          fi
          
          echo "Authenticating Tailscale node..."
          docker exec lab-node tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="kali-lab-node"
          docker exec lab-node tailscale status

      - name: Monitor Termination Signal
        run: |
          HOURS=${{ github.event.inputs.lab_duration_hours }}
          MAX_SECONDS=$(( (HOURS * 3600) - 900 )) 
          START_TIME=$(date +%s)
          
          echo "Initiating telemetry loop. Maximum duration: ${MAX_SECONDS}s."
          echo "To terminate early, create an empty file at: /home/kali/Desktop/close.txt"
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Maximum safe execution time reached."
              break
            fi
            
            if docker exec lab-node test -f /home/kali/Desktop/close.txt; then
              echo "Termination signal located."
              break
            fi
            
            sleep 30
          done

      - name: XFCE Desktop Telemetry Dump
        if: always()
        run: |
          echo "Extracting XFCE render logs from container..."
          docker exec lab-node cat /home/kali/desktop.log || echo "XFCE Log file inaccessible."
          echo "Extracting Core System Logs..."
          docker logs lab-node | tail -n 50

      - name: Graceful Shutdown and State Persistence
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^lab-node$'; then
            echo "Initiating graceful shutdown..."
            docker stop -t 30 lab-node || true
            
            IMAGE_TAG="surajgupta2009/kalidocker"
            RUN_TAG="${IMAGE_TAG}:run-${{ github.run_id }}"
            LATEST_TAG="${IMAGE_TAG}:latest"
            
            echo "Committing filesystem snapshot..."
            docker commit lab-node $RUN_TAG
            docker tag $RUN_TAG $LATEST_TAG
            
            echo "Uploading state to registry..."
            docker push $RUN_TAG
            docker push $LATEST_TAG
          fi
