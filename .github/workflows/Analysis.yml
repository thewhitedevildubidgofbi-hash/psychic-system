name: Deploy Unrestricted Analysis Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6' # Maximum limit for standard GitHub Actions jobs

jobs:
  run-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Initialize Unrestricted Container
        run: |
          docker run -d \
            --name lab-node \
            --privileged \
            --network host \
            --pid host \
            --ipc host \
            -v /:/host_root \
            -v "${{ github.workspace }}:/root/projects" \
            naitikgupta2009/ultimate-idx-lab:v1 sleep infinity

      - name: Execute Lab Initialization
        run: |
          docker exec -d lab-node /root/start-lab.sh

      - name: Enforce Variable Runtime Hold
        run: |
          HOURS=${{ github.event.inputs.lab_duration_hours }}
          SECONDS=$(( HOURS * 3600 ))
          echo "Lab initialized successfully."
          echo "Holding environment active for ${HOURS} hour(s) (${SECONDS} seconds)..."
          
          # Keeps the runner alive by executing a blocking loop
          sleep $SECONDS
