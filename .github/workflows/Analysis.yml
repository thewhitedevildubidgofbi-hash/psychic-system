name: Deploy Unrestricted Analysis Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  run-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Initialize Unrestricted Container
        run: |
          docker run -d \
            --name lab-node \
            --privileged \
            --network host \
            --pid host \
            --ipc host \
            -e DEBIAN_FRONTEND=noninteractive \
            -v /:/host_root \
            -v "${{ github.workspace }}:/root/projects" \
            naitikgupta2009/ultimate-idx-lab:v1 sleep infinity

      - name: Execute D-Bus & Lab Initialization
        run: |
          docker exec lab-node bash -c "mkdir -p /run/dbus && service dbus start"
          docker exec -d lab-node /root/start-lab.sh

      - name: Monitor Termination Signal
        run: |
          HOURS=${{ github.event.inputs.lab_duration_hours }}
          MAX_SECONDS=$(( HOURS * 3600 ))
          ELAPSED=0
          POLL_INTERVAL=300
          
          echo "Initiating telemetry loop. Maximum duration: ${MAX_SECONDS}s."
          echo "Polling for /root/desktop/close.txt every 300s."
          
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            if docker exec lab-node test -f /root/desktop/close.txt; then
              echo "Termination signal located. Exiting loop."
              break
            fi
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          
          if [ $ELAPSED -ge $MAX_SECONDS ]; do
            echo "Maximum execution time reached. Initiating fallback termination."
          fi

      - name: Graceful Shutdown and Persistence
        if: always()
        run: |
          echo "Ingesting workspace data to persistence layer..."
          docker exec lab-node cp -r /root/projects /root/persisted-projects || true
          
          echo "Initiating graceful container shutdown (30s timeout)..."
          docker stop -t 30 lab-node || true
          
          echo "Committing filesystem snapshot..."
          docker commit lab-node naitikgupta2009/ultimate-idx-lab:v1
          
          echo "Uploading image to registry..."
          docker push naitikgupta2009/ultimate-idx-lab:v1
