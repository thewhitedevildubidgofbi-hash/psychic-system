name: Deploy Unrestricted Analysis Lab

on:
  workflow_dispatch:
    inputs:
      lab_duration_hours:
        description: 'Select lab operational duration (Hours)'
        required: true
        default: '2'
        type: choice
        options: [ '1', '2', '3', '4', '5', '6' ]

jobs:
  run-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to Docker Registry
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Initialize GUI-Optimized Container (Total Persistence Mode)
        run: |
          docker run -d \
            --name lab-node \
            --privileged \
            --network host \
            --pid host \
            --ipc host \
            --shm-size="2g" \
            --cgroupns host \
            -e DEBIAN_FRONTEND=noninteractive \
            -e NEEDRESTART_MODE=a \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e GALLIUM_DRIVER=llvmpipe \
            naitikgupta2009/ultimate-idx-lab:v1 sleep infinity

      - name: Execute D-Bus & Lab Initialization
        run: |
          docker exec lab-node bash -c "mkdir -p /run/dbus && service dbus start"
          docker exec -d lab-node /root/start-lab.sh

      - name: Core Protocol Replacement (XRDP -> NoMachine)
        run: |
          echo "Purging deprecated XRDP server..."
          docker exec lab-node apt-get remove --purge -y xrdp xrdp-pulseaudio-installer || true
          
          echo "Acquiring latest NoMachine Debian package..."
          # Dynamically scrape the official site for the latest AMD64 package URL to prevent 404s
          DOWNLOAD_URL=$(curl -s "https://www.nomachine.com/download/download&id=10" | grep -oP 'https://download.nomachine.com/download/\d+\.\d+/Linux/nomachine_[^"]+_amd64.deb' | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to parse NoMachine download URL."
            exit 1
          fi
          
          echo "Fetching from: $DOWNLOAD_URL"
          docker exec lab-node wget -qO /tmp/nomachine.deb "$DOWNLOAD_URL"
          
          echo "Executing NoMachine installation..."
          # The '|| true' prevents GitHub Actions from killing the workflow when dpkg detects missing dependencies
          docker exec lab-node dpkg -i /tmp/nomachine.deb || true
          
          echo "Resolving dependencies..."
          docker exec lab-node apt-get install -f -y
          
          echo "Enabling Desktop Environment mapping..."
          docker exec lab-node bash -c 'echo "DefaultDesktopCommand \"/usr/bin/startxfce4\"" >> /usr/NX/etc/node.cfg'
          
          echo "Modifying lab initialization script..."
          docker exec lab-node sed -i 's/service xrdp start/\/usr\/NX\/bin\/nxserver --startup/g' /root/start-lab.sh
          
          echo "Starting NX Server..."
          docker exec lab-node /usr/NX/bin/nxserver --startup

      - name: Monitor Termination Signal
        run: |
          HOURS=${{ github.event.inputs.lab_duration_hours }}
          # Subtract 900 seconds (15 minutes) buffer to account for image upload sequences
          MAX_SECONDS=$(( (HOURS * 3600) - 900 )) 
          START_TIME=$(date +%s)
          
          echo "Initiating telemetry loop. Maximum duration: ${MAX_SECONDS}s."
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "Maximum safe execution time reached. Initiating sequence."
              break
            fi
            
            if docker exec lab-node test -f /root/desktop/close.txt; then
              echo "Termination signal located. Exiting loop."
              break
            fi
            
            sleep 30
          done

      - name: Graceful Shutdown and Monolithic State Persistence
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^lab-node$'; then
            echo "Container detected. Initiating graceful shutdown..."
            docker stop -t 30 lab-node || true
            
            IMAGE_TAG="naitikgupta2009/ultimate-idx-lab"
            RUN_TAG="${IMAGE_TAG}:run-${{ github.run_id }}"
            LATEST_TAG="${IMAGE_TAG}:v1"
            
            echo "Committing absolute filesystem snapshot..."
            docker commit lab-node $RUN_TAG
            docker tag $RUN_TAG $LATEST_TAG
            
            echo "Uploading monolithic state to registry..."
            docker push $RUN_TAG
            docker push $LATEST_TAG
          else
            echo "Container 'lab-node' was never initialized. Skipping persistence layer."
          fi
